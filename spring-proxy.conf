server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html;
    index index.html;

    # 1. Lưu lượng TĨNH: trỏ thẳng vào /var/www/html/
    location / {
        try_files $uri $uri/ =404;
    }

    # 2. Lưu lượng ĐỘNG (API): reverse proxy tới Spring Boot cổng 8082
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;

        # Chuyển tiếp tiêu đề để backend nhận diện đúng Client
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
